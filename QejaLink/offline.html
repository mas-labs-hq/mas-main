<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#1B2A3E">
    <title>Offline - QejaLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Satisfy&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #1B2A3E; color: #EDEBE4;
            font-family: 'Outfit', sans-serif; text-align: center; padding: 2rem;
        }
        .offline-wrap { max-width: 420px; }
        .offline-logo {
            width: 80px; height: 80px; margin: 0 auto 28px;
            border: 2px solid rgba(201, 168, 76, 0.3);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            animation: pulse 1.8s ease-in-out infinite;
        }
        .offline-logo svg { width: 40px; height: 40px; }
        .offline-title {
            font-size: 1.75rem; font-weight: 700; letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #A68B3C, #E2CC7E, #C9A84C);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-bottom: 8px;
        }
        .offline-subtitle {
            font-size: 0.75rem; font-weight: 400; letter-spacing: 6px;
            text-transform: uppercase; color: #6B7080; margin-bottom: 24px;
        }
        .offline-divider { width: 50px; height: 1px; background: #C9A84C; margin: 16px auto; opacity: 0.5; }
        .offline-tagline { font-family: 'Satisfy', cursive; font-size: 1.1rem; color: #C9A84C; margin-bottom: 32px; }
        .offline-message { color: #B0B4BE; font-size: 0.95rem; line-height: 1.65; margin-bottom: 28px; }
        .offline-btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 12px 28px; background: #C9A84C; color: #08090C;
            border: none; border-radius: 8px; font-family: inherit;
            font-size: 0.85rem; font-weight: 600; letter-spacing: 1px;
            text-transform: uppercase; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .offline-btn:hover { background: #E2CC7E; transform: translateY(-2px); }
        .offline-btn svg { width: 16px; height: 16px; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div class="offline-wrap">
        <div class="offline-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </div>
        <h1 class="offline-title">QejaLink</h1>
        <p class="offline-subtitle">Houses for Rent & Sale</p>
        <div class="offline-divider"></div>
        <p class="offline-tagline">Powered By MortApps Studios</p>
        <p class="offline-message">
            You are currently offline. QejaLink needs an internet connection to show you the latest house listings across Kenya. Please check your connection and try again.
        </p>
        <button class="offline-btn" onclick="location.reload()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 4v6h-6"></path>
                <path d="M1 20v-6h6"></path>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"></path>
                <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"></path>
            </svg>
            Retry Connection
        </button>
    </div>
</body>
</html>
